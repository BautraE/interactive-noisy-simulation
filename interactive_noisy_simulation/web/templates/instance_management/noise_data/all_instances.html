{% extends "base.html" %}

{% block css %}
<link rel="stylesheet" 
      href="../styles/page_specific/instance_management/noise_data/all_instances.css">
{% endblock %}

{% block content %}
<!-- Instance type navigation -->
<nav class="side-navbar">
    <h1>Instance Types</h1>
    <ul>
        <li>
            <a href="">Noise Data</a>
        </li>
    </ul>
</nav>
<!-- Current page content -->
<div class="content-container">
    <h1 class="content-container-heading">Noise Data Instance Management</h1>
    <div class="content-box-header">
        <div class="left">
            <p>Noise data instances:</p>
        </div>
        <div class="right">
            <div role="button"
                 class="clickable button-a dark-button"
                 onclick="showPopUpWindow('create_noise_data_instance')">Create new instance</div>
        </div>
    </div>
    <div id="content-box" 
         class="content-box noise-data-instances-content-box"></div>
</div>
{% endblock %}

{% block scripts %}
<script type="text/javascript" 
        src="../scripts/instance_management/noise_data_manager/all_instances.js"></script>
{% endblock %}
